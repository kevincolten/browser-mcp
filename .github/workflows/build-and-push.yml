name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kevincolten/browser-mcp:latest
            ghcr.io/kevincolten/browser-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
